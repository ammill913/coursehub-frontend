<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub | Вхід</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>CH.redirectIfLoggedIn();</script>
</head>
<body>
    <header id="site-header" class="header"></header>

    <main class="container narrow">
        <section class="page-header">
            <h2>Вхід</h2>
            <p>Увійдіть, щоб додавати та редагувати записи каталогу.</p>
        </section>

        <div id="message"></div>

        <form id="login-form" class="form card-form">
            <div class="form-row">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" maxlength="150" required autocomplete="username">
                <small class="field-error" data-for="username"></small>
            </div>
            <div class="form-row">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password">
                <small class="field-error" data-for="password"></small>
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn">Увійти</button>
            </div>
            <p class="form-hint">Немає акаунта? <a href="register.html">Зареєструватися</a></p>
        </form>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
