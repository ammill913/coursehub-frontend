<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub | Профіль</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>CH.requireAuth();</script>
</head>
<body>
    <header id="site-header" class="header"></header>

    <main class="container">
        <section class="page-header">
            <h2>Мій профіль</h2>
            <p>Ця сторінка доступна лише авторизованим користувачам.</p>
        </section>

        <div id="message"></div>

        <div class="panels">
            <section class="panel">
                <h3>Дані акаунта</h3>
                <div id="profile-info" class="course-meta"></div>
            </section>
            <section class="panel">
                <h3>Що мені дозволено</h3>
                <ul id="rights" class="plain-list"></ul>
            </section>
            <section class="panel">
                <h3>Токени</h3>
                <div id="token-info" class="course-meta"></div>
                <div class="form-buttons">
                    <button id="refresh-btn" type="button" class="btn btn-outline">Оновити access токен</button>
                    <button id="expire-btn" type="button" class="btn btn-outline">Симулювати закінчення токена</button>
                </div>
                <p class="form-hint">Access токен живе недовго. Коли він закінчується, фронтенд сам отримує новий за refresh токеном.</p>
            </section>
        </div>

        <div class="form-buttons">
            <button id="profile-logout" type="button" class="btn btn-danger">Вийти з акаунта</button>
        </div>
    </main>

    <script src="js/profile.js"></script>
</body>
</html>
